location = /nginx-health { access_log off; return 200 "ok\n"; }
location = /api/revalidate {
    limit_req zone=publication burst=2 nodelay;
    proxy_pass http://frontend_app;
    include /etc/nginx/snippets/proxy.conf;
}
location = /api/admin/content/images {
    # Editor image uploads are larger than the global 32k request limit.
    client_max_body_size 6m;
    proxy_pass http://backend_app;
    include /etc/nginx/snippets/proxy.conf;
}
location /uploads/ {
    # Uploaded editor images (converted to WebP on upload); immutable names.
    alias /var/www/bks-lab-uploads/;
    expires 30d;
    # This location's own add_header replaces the inherited security set.
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
}
location /api/ {
    proxy_pass http://backend_app;
    include /etc/nginx/snippets/proxy.conf;
}
location / {
    proxy_pass http://frontend_app;
    include /etc/nginx/snippets/proxy.conf;
}
