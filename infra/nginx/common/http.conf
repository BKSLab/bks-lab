# Deliberately omit IP, query strings, referrers, cookies and user agents.
log_format site '$time_iso8601 "$request_method $uri" $status $body_bytes_sent $request_time';
server_tokens off;
client_max_body_size 32k;
limit_req_zone $binary_remote_addr zone=publication:1m rate=6r/m;
# Docker service addresses can change when application containers are replaced.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 5s;
upstream frontend_app {
    zone frontend_app 64k;
    server frontend:3000 resolve;
}
upstream backend_app {
    zone backend_app 64k;
    server backend:8000 resolve;
}
map $uri $site_csp {
    default "default-src 'self'; script-src 'self' 'unsafe-inline' https://yandex.ru https://*.yandex.ru https://yastatic.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.yandex.ru https://*.yandex.net https://*.yastatic.net; font-src 'self'; connect-src 'self' https://*.yandex.ru https://*.yandex.net; frame-src https://*.yandex.ru https://*.yandex.net; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    ~^/(admin|api/admin)(/|$) "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}
