name: bks-lab-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend-runtime: &backend-runtime
  build: ./backend
  image: bks-lab-backend:prod
  env_file: ./backend/.env.production
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [app]
  logging: *logging

services:
  db:
    image: postgres:16-alpine
    env_file: ./backend/.env.production
    restart: unless-stopped
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app]
    logging: *logging

  backend:
    <<: *backend-runtime
    volumes:
      - uploads:/app/uploads
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 10

  news-analyzer-scheduler:
    <<: *backend-runtime
    # The healthy API has already applied migrations and seeded the catalogue.
    entrypoint: ["python", "-m", "src.background_tasks.news_scheduler"]
    command: []
    depends_on:
      backend: {condition: service_healthy}
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "python", "-m", "src.background_tasks.news_health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  frontend:
    build:
      context: ./frontend
      secrets: [frontend_env]
    image: bks-lab-frontend:prod
    env_file: ./frontend/.env.production
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Next.js writes its ISR cache; the application runs as UID 1001.
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/admin/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 10
    networks: [app]
    logging: *logging

  nginx:
    image: nginx:1.28-alpine
    env_file: ./frontend/.env.production
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ${NGINX_TEMPLATE_DIR:-./infra/nginx/http}:/etc/nginx/templates:ro
      - ./infra/nginx/common:/etc/nginx/snippets:ro
      - certificates:/etc/letsencrypt:ro
      - acme:/var/www/certbot:ro
      - uploads:/var/www/bks-lab-uploads:ro
    depends_on:
      frontend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [app]
    logging: *logging

  certbot:
    image: certbot/certbot:v5.4.0
    profiles: [tools]
    volumes:
      - certificates:/etc/letsencrypt
      - acme:/var/www/certbot
    networks: [app]
    logging: *logging

secrets:
  frontend_env:
    file: ./frontend/.env.production

volumes:
  pg_data:
  uploads:
  certificates:
  acme:

networks:
  app:
    driver: bridge
